<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="theme-color"
      content="#f4f1ea"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1b1a17"
      media="(prefers-color-scheme: dark)"
    />
    <title>我的对话库</title>
    <script src="/assets/js/theme-boot.js"></script>
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/layout.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/sidebar.css" />
    <link rel="stylesheet" href="/assets/css/list.css" />
    <link rel="stylesheet" href="/assets/css/reader.css" />
    <link rel="stylesheet" href="/assets/css/manager.css" />
    <script type="module" src="/assets/js/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#list-pane">跳到资料列表</a>
    <div id="app">
      <aside id="sidebar" aria-label="来源目录"></aside>
      <section id="list-pane" tabindex="-1" aria-label="资料列表"></section>
      <main id="reader-pane" aria-label="阅读区"></main>
      <div
        id="split-side"
        class="splitter"
        role="separator"
        tabindex="0"
        aria-orientation="vertical"
        aria-label="调整目录栏宽度"
      ></div>
      <div
        id="split-list"
        class="splitter"
        role="separator"
        tabindex="0"
        aria-orientation="vertical"
        aria-label="调整列表栏宽度"
      ></div>
    </div>
    <div id="toasts" role="region" aria-label="消息"></div>
    <noscript>请启用 JavaScript 以浏览本地资料。</noscript>
  </body>
</html>
