<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f1ea">
    <title>Markdown 阅读</title>
    <style>
      :root { color: #25251f; background: #f4f1ea; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; background: #f4f1ea; }
      .reader-shell { width: min(920px, calc(100vw - 40px)); margin: 0 auto; padding: 70px 0 100px; }
      .reader-top { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 34px; }
      .eyebrow { margin: 0; color: #dd5f42; font-size: 11px; font-weight: 700; letter-spacing: .2em; }
      .back-link { color: #bb4e36; font-size: 12px; text-decoration: none; }
      .back-link:hover { text-decoration: underline; }
      .markdown-content { border: 1px solid rgba(37,37,31,.1); border-radius: 18px; padding: clamp(28px, 6vw, 72px); background: #fbfaf7; box-shadow: 0 18px 60px rgba(64,52,32,.09); color: #66665e; font-family: Georgia, "Songti SC", serif; font-size: 17px; line-height: 1.9; }
      .markdown-content h1, .markdown-content h2, .markdown-content h3 { margin: 0 0 22px; color: #25251f; font-weight: 400; line-height: 1.25; }
      .markdown-content h1 { font-size: clamp(30px, 5vw, 48px); letter-spacing: -.05em; }
      .markdown-content h2 { margin-top: 42px; font-size: 30px; }
      .markdown-content h3 { margin-top: 30px; font-size: 23px; }
      .markdown-content p { margin: 16px 0; }
      .markdown-content ul { padding-left: 28px; }
      .markdown-content ol { padding-left: 28px; }
      .markdown-content li { padding-left: 5px; }
      .markdown-content blockquote { margin: 22px 0; border-left: 3px solid #dd5f42; padding: 2px 0 2px 20px; color: #77756c; }
      .markdown-content hr { margin: 34px 0; border: 0; border-top: 1px solid rgba(37,37,31,.14); }
      .markdown-content table { display: block; width: 100%; overflow-x: auto; margin: 24px 0; border-collapse: collapse; font-family: Inter, ui-sans-serif, sans-serif; font-size: 13px; line-height: 1.6; }
      .markdown-content th, .markdown-content td { min-width: 120px; border: 1px solid rgba(37,37,31,.12); padding: 9px 11px; text-align: left; vertical-align: top; }
      .markdown-content th { color: #25251f; background: #ebe6dc; font-weight: 600; }
      .markdown-content a { color: #bb4e36; }
      .markdown-content strong { color: #25251f; }
      .markdown-content code { border-radius: 5px; padding: 2px 6px; background: #ebe6dc; color: #55554d; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
      .markdown-content pre { overflow: auto; border-radius: 9px; padding: 18px; background: #272822; color: #f8f8f2; font: 14px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace; }
      .markdown-content pre code { padding: 0; color: inherit; background: transparent; }
      .reader-status { color: #8d8b82; font: 13px/1.6 Inter, ui-sans-serif, sans-serif; }
      .reader-error { color: #bb4e36; }
      @media (max-width: 700px) { .reader-shell { width: min(100% - 24px, 920px); padding-top: 32px; }.reader-top { align-items: flex-start; flex-direction: column; }.markdown-content { padding: 26px 20px; font-size: 16px; } }
    </style>
  </head>
  <body>
    <main class="reader-shell">
      <div class="reader-top"><p class="eyebrow">MARKDOWN READER</p><a class="back-link" href="/">返回知识库</a></div>
      <article id="markdownContent" class="markdown-content"><p class="reader-status">正在加载 Markdown…</p></article>
    </main>
    <script src="/assets/markdown-viewer.js" defer></script>
  </body>
</html>
